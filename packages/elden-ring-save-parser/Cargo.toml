[package]
name = "elden-ring-save-parser"
version = "0.1.0"
authors = ["EthanShoeDev <13422990+EthanShoeDev@users.noreply.github.com>"]
edition = "2021"

# Thin wasm-bindgen wrapper around our fork of ER-Save-Lib (packages/er-save-lib).
# All save-format knowledge lives in the fork; this crate only crosses the wasm boundary:
# parse a save and emit the lean, web-facing `LeanSave` DTO as a JS value.
# See docs/projects/wasm-save-parser-rewrite.md.

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
# Better panic messages in the browser console (dev aid; pulls in std fmt/panicking).
console_error_panic_hook = { version = "0.1.7", optional = true }
serde-wasm-bindgen = "0.6.5"
er-save-lib = { path = "../er-save-lib" }

[profile.release]
# Optimize for small code size.
opt-level = "s"
